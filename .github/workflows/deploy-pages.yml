name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----- Backend (gera JSONs do modo demo) -----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps (minimal — sem STT/RAG pesados)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest parquets → SQLite
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: "sk-ant-api03-NOT-NEEDED-FOR-DEMO-JSON"
        run: |
          python -m scripts.ingest --dias-planner 6

      - name: Build demo JSONs → frontend/public/data-demo
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: "sk-ant-api03-NOT-NEEDED-FOR-DEMO-JSON"
        run: |
          python -m scripts.build_demo

      # ----- Frontend -----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci || npm install

      - name: Build (modo demo, base path do GH Pages)
        working-directory: frontend
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DEMO_MODE: "true"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
